# This workflow will build a Python project (ODOO)
# Pipeline configurado para runner - VISERION

name: ODOO Sigedat CI/CD Pipeline

permissions:
  packages: write
  contents: read

on:
  push:
    branches: [ "main", "release", "develop" ] 

# BLOQUEAR COMPLETAMENTE EL PIPELINE PARA RAMAS FEATURE
# No ejecutar NADA si es rama feature (push, pull request, o cualquier evento)

env:
  ODOO_VERSION: '15.0'

jobs:
  # CONDICIÓN A NIVEL DE WORKFLOW - NO EJECUTA SI ES RAMA FEATURE
  # SOLO SI LA RAMA ES: main, release o develop
  check-branch:
    name: Check branch
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/feature/') && !startsWith(github.head_ref, 'feature/') }}
    steps:
      - name: Verificar que no sea branch feature
        run: |
          echo "=== VERIFICACIÓN DE RAMA ==="
          echo "✅ github.ref: ${{ github.ref }}"
          echo "✅ github.head_ref: ${{ github.head_ref }}"
          echo "✅ github.event_name: ${{ github.event_name }}"
          echo "🌿 Branch valida - continuando con el pipeline..."







    
-------------------------------------------------------------------------------
    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Construir Imagen Docker 
      run:  |
        echo "⚙️ Construyendo imagen docker..."
              docker build -t ${{ secrets.IMAGE_NAME }}:latest .

    - name: Depliegue en Docker
      run: |
        echo "Desplegando aplicación..."
        echo "🔴 Deteniendo contenedor existente..."
              docker stop cuarto-datos

        echo "❌ Eliminando contenedor existente..."
              docker rm cuarto-datos

        echo "🧹 Depurando el sistema..."
              docker system prune -f

        echo "🚀 Aplicando nuevo manifiesto... "
              docker-compose up -d 
              docker rename cuarto-datos-front_www_1 cuarto-datos

        echo "📄 Listando contenedor..."
              docker ps -f name=cuarto-datos 

        echo "✅ Nuevo despliegue finalizado con exito" 
        echo "🔔 Probar URL: https://guatoc.acueducto.com.co/login_datos.php"


        



  


        
    



  
